# Apply in each namespace Prometheus scrapes.
# Without this policy, default-deny drops the scrape and the target stays down.
# Platform namespaces (traefik, cert-manager, argocd, kube-system) are below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-ingress
  namespace: handlingar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9402
        - protocol: TCP
          port: 9153
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
---
