fullnameOverride: alloy

alloy:
  enableReporting: false
  stabilityLevel: generally-available
  mounts:
    varlog: true
    dockercontainers: false
    extra:
      - name: tmp
        mountPath: /tmp
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Host log paths under /var/log/pods are root-owned on K3s nodes.
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  configMap:
    content: |
      logging {
        level = "info"
        format = "logfmt"
      }

      local.file_match "pod_logs" {
        path_targets = [{
          __path__ = "/var/log/pods/*/*/*.log",
          job      = "kubernetes-pods",
        }]
      }

      loki.source.file "pod_logs" {
        targets               = local.file_match.pod_logs.targets
        forward_to            = [loki.process.pod_logs.receiver]
        legacy_positions_file = "/tmp/positions.yml"
      }

      loki.process "pod_logs" {
        forward_to = [loki.write.default.receiver]

        stage.cri {}

        // Path: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
        stage.regex {
          expression = "/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[0-9a-fA-F-]{36}/(?P<container>[^/]+)/.*"
          source     = "filename"
        }

        stage.labels {
          values = {
            namespace = "",
            pod       = "",
            container = "",
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  volumes:
    extra:
      - name: tmp
        emptyDir: {}

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
