apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-exporter-dsn
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: postgres-exporter-dsn
    creationPolicy: Owner
  data:
    - secretKey: dsn
      remoteRef:
        key: observability/postgres-exporter-dsn
        property: dsn
