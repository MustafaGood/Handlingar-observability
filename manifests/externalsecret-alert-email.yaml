apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-smtp
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-kube-prometheus-stack-alertmanager
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: "{{ .host }}:{{ .port }}"
            smtp_from: "{{ .from }}"
            smtp_require_tls: false
          route:
            receiver: email
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
          receivers:
            - name: email
              email_configs:
                - to: "{{ .to }}"
                  send_resolved: true
  data:
    - secretKey: host
      remoteRef:
        key: alert-smtp
        property: host
    - secretKey: port
      remoteRef:
        key: alert-smtp
        property: port
    - secretKey: from
      remoteRef:
        key: alert-smtp
        property: from
    - secretKey: to
      remoteRef:
        key: alert-smtp
        property: to
