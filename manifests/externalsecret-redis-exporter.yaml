apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-exporter
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-exporter
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: observability/redis-exporter
        property: password
