fullnameOverride: memcached-exporter

service:
  portName: http-alt

extraArgs:
  memcached.address: memcached.handlingar.svc.cluster.local:11211

serviceMonitor:
  enabled: true
  multipleTarget: true
  telemetryPath: /scrape
  interval: 30s
  targets:
    - url: memcached.handlingar.svc.cluster.local:11211
      name: handlingar
      additionalMetricsRelabels:
        env: handlingar
    - url: memcached.tst.svc.cluster.local:11211
      name: tst
      additionalMetricsRelabels:
        env: tst
    - url: memcached.qat.svc.cluster.local:11211
      name: qat
      additionalMetricsRelabels:
        env: qat

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
