fullnameOverride: postgres-exporter

config:
  datasourceSecret:
    name: postgres-exporter-dsn
    key: dsn

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: false
